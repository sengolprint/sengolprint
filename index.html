<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sengol Print</title>
<style>html,body{margin:0;min-height:100%;background:#f3f6fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.boot-error{max-width:720px;margin:80px auto;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:16px}</style>
</head>
<body>
<script>
(async()=>{
  const response=await fetch('/app-source.html?v=20260928-cap73-v11',{cache:'no-store'});
  if(!response.ok)throw new Error('App source load failed: '+response.status);
  let html=await response.text();

  const fixStyle=`<style id="mc-layout-v11">
#marksCalculator{display:block!important;width:100%!important;max-width:none!important;min-height:100vh!important;background:#f3f6fb!important;overflow-x:auto!important}
#marksCalculator.hidden{display:none!important}
#marksCalculator .dash-content{display:block!important;width:100%!important;max-width:none!important;min-width:0!important;padding:20px 28px!important;margin:0!important}
#marksCalculator .dash-content>div{display:block!important;width:min(1320px,100%)!important;max-width:1320px!important;min-width:0!important;margin:14px auto!important;padding:18px 22px!important;box-sizing:border-box!important}
#marksCalculator #mcSummary{width:100%!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:12px!important;margin-bottom:16px!important}
#marksCalculator #mcSummary>div{min-height:68px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;padding:10px 14px!important;box-sizing:border-box!important}
#marksCalculator #mcTable{width:100%!important;min-width:1080px!important;table-layout:fixed!important;border-collapse:collapse!important}
#marksCalculator #mcTable th,#marksCalculator #mcTable td{box-sizing:border-box!important;vertical-align:middle!important;text-align:center!important;white-space:nowrap!important;padding:6px 7px!important}
#marksCalculator #mcTable thead th{height:34px!important;line-height:1.1!important;font-weight:800!important}
#marksCalculator #mcTable tbody tr,#marksCalculator #mcTable tbody td{height:50px!important}
#marksCalculator #mcTable th:first-child,#marksCalculator #mcTable td:first-child{text-align:left!important}
#marksCalculator #mcTable input{display:block!important;width:68px!important;height:32px!important;margin:0 auto!important;padding:4px 8px!important;border:1px solid #cbd5e1!important;border-radius:8px!important;text-align:center!important;background:#fff!important;box-sizing:border-box!important}
#marksCalculator #mcTable td:first-child input{width:100%!important;height:32px!important;margin:0!important;text-align:left!important}
#marksCalculator #mcTable td.mxT,#marksCalculator #mcTable td.obT,#marksCalculator #mcTable td.pct{border:0!important;background:transparent!important;height:50px!important}
#marksCalculator .mc-auto-tools{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:7px!important;font-size:.75rem!important;color:#64748b!important}
#marksCalculator #mcAuto{width:62px!important;height:32px!important;text-align:center!important;padding:4px 6px!important;border:1px solid #dbe2ea!important;border-radius:8px!important;box-sizing:border-box!important}
#marksCalculator #mcFillMarks{height:32px!important;padding:4px 12px!important;border:0!important;border-radius:8px!important;background:#176b50!important;color:#fff!important;font-weight:800!important;cursor:pointer!important}
@media(max-width:900px){#marksCalculator .dash-content{padding:14px!important}#marksCalculator .dash-content>div{width:100%!important;padding:14px!important}#marksCalculator #mcSummary{grid-template-columns:1fr!important}}
</style>`;
  html=html.replace('</head>',fixStyle+'</head>');

  const old1='<label style="font-size:.75rem;color:#64748b">Auto-fill at <input id="mcAuto" type="number" min="0" max="100" value="65" style="width:58px;padding:7px;border:1px solid #dbe2ea;border-radius:8px"> %</label>';
  const old2='<div style="display:flex;align-items:center;gap:7px;font-size:.75rem;color:#64748b">Target <input id="mcAuto" type="number" min="40" max="100" value="65" style="width:62px;height:32px;padding:4px 6px;text-align:center;border:1px solid #dbe2ea;border-radius:8px"> % <button id="mcFillMarks" type="button" style="height:32px;padding:4px 12px;border:0;border-radius:8px;background:#176b50;color:#fff;font-weight:800;cursor:pointer">Fill Marks</button></div>';
  const controls='<div class="mc-auto-tools">Auto-fill at <input id="mcAuto" type="number" min="40" max="100" step="0.1" value="65"> % <button id="mcFillMarks" type="button">Fill</button></div>';
  html=html.replace(old1,controls).replace(old2,controls);

  const override=`<script>(function(){
    const q=id=>document.getElementById(id), table=q('mcTable'), auto=q('mcAuto'), btn=q('mcFillMarks');
    if(!table||!auto||!btn)return;
    const body=table.querySelector('tbody'); let serial=0;
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    function lim(r){const me=Math.max(0,+r.querySelector('.mxE').value||0),mi=Math.max(0,+r.querySelector('.mxI').value||0),minE=Math.ceil(me*.4),minI=Math.ceil(mi*.4);return{me,mi,minE,minI,minT:minE+minI,maxT:me+mi}}
    function cap(l,target){return target>=63&&target<=70?Math.min(l.maxT,73):l.maxT}
    function refresh(){let got=0,max=0;[...body.rows].forEach(r=>{const l=lim(r),e=+r.querySelector('.obE').value||0,i=+r.querySelector('.obI').value||0,t=e+i;r.querySelector('.mxT').textContent=l.maxT;r.querySelector('.obT').textContent=t;r.querySelector('.pct').textContent=(l.maxT?t/l.maxT*100:0).toFixed(1)+'%';got+=t;max+=l.maxT});const pc=max?got/max*100:0;q('mcSummary').innerHTML='<div style="padding:12px;border:1px solid #dbe2ea;border-radius:12px"><small>Status</small><b style="display:block;color:'+(pc>=40?'#00875a':'#c62828')+'">'+(pc>=40?'Pass':'Fail')+'</b></div><div style="padding:12px;border:1px solid #dbe2ea;border-radius:12px"><small>Obtained</small><b style="display:block">'+got+'</b></div><div style="padding:12px;border:1px solid #dbe2ea;border-radius:12px"><small>Total &nbsp; '+pc.toFixed(1)+'%</small><b style="display:block">'+max+'</b></div>'}
    function fill(){const target=clamp(+auto.value||40,40,100);auto.value=target;serial++;const rows=[...body.rows];if(!rows.length)return;const ls=rows.map(lim),grandMax=ls.reduce((s,x)=>s+x.maxT,0),grandMin=ls.reduce((s,x)=>s+x.minT,0);let wanted=clamp(Math.round(grandMax*target/100),grandMin,grandMax);wanted=Math.min(wanted,ls.reduce((s,x)=>s+cap(x,target),0));const prev=rows.map(r=>(+r.querySelector('.obE').value||0)+(+r.querySelector('.obI').value||0));const cand=ls.map((l,i)=>{const ideal=l.maxT*target/100,a=[];for(let v=l.minT;v<=cap(l,target);v++)a.push(v);a.sort((x,y)=>(Math.abs(x-ideal)+(x===prev[i]?2:0)+((x+serial+i)%11)/100)-(Math.abs(y-ideal)+(y===prev[i]?2:0)+((y+serial+i)%11)/100));return a});const result=new Array(rows.length),used=new Set();let nodes=0;function dfs(pos,sum){if(++nodes>500000)return false;if(pos===rows.length)return sum===wanted;let mn=0,mx=0;for(let j=pos;j<rows.length;j++){let lo=null,hi=null;for(const v of cand[j])if(!used.has(v)){if(lo===null||v<lo)lo=v;if(hi===null||v>hi)hi=v}if(lo===null)return false;mn+=lo;mx+=hi}if(sum+mn>wanted||sum+mx<wanted)return false;for(const v of cand[pos]){if(used.has(v)||sum+v>wanted)continue;used.add(v);result[pos]=v;if(dfs(pos+1,sum+v))return true;used.delete(v)}return false}if(!dfs(0,0)){let cur=0;for(let i=0;i<rows.length;i++){result[i]=clamp(Math.round(ls[i].maxT*target/100),ls[i].minT,cap(ls[i],target));cur+=result[i]}let guard=0;while(cur!==wanted&&guard++<10000){const d=cur<wanted?1:-1;let ch=false;for(let i=0;i<result.length;i++){const n=result[i]+d;if(n<ls[i].minT||n>cap(ls[i],target))continue;result[i]=n;cur+=d;ch=true;if(cur===wanted)break}if(!ch)break}}
      const usedPairs=new Set();rows.forEach((r,i)=>{const l=ls[i],t=result[i],low=Math.max(l.minE,t-l.mi),high=Math.min(l.me,t-l.minI),opts=[];for(let e=low;e<=high;e++)opts.push(e);opts.sort(()=>Math.random()-.5);let ext=opts[0]??low;for(const e of opts){const k=e+'|'+(t-e);if(!usedPairs.has(k)){ext=e;break}}const intl=t-ext;usedPairs.add(ext+'|'+intl);r.querySelector('.obE').value=ext;r.querySelector('.obI').value=intl});refresh()}
    btn.onclick=e=>{e.preventDefault();e.stopPropagation();fill()};auto.onchange=null;auto.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fill()}};
  })();<\/script>`;
  html=html.replace('</body>',override+'<script src="/student-gradepoint-auto.js?v=20260928-v1"><\\/script><script src="/student-semester-summary.js?v=20260928-v3"><\\/script></body>');
  document.open();document.write(html);document.close();
})().catch(error=>{console.error(error);document.body.innerHTML='<div class="boot-error"><h2>Page load issue</h2><p>Please refresh the page.</p></div>'});
</script>
</body>
</html>
