name: Fix image design save

on:
  push:
    paths:
      - '.github/workflows/fix-image-design-save.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compress uploaded design images before persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""const out=document.createElement('canvas');out.width=right-left+1;out.height=bottom-top+1;out.getContext('2d').drawImage(canvas,left,top,out.width,out.height,0,0,out.width,out.height);resolve(out.toDataURL('image/png'))"""
          new="""const cropW=right-left+1,cropH=bottom-top+1,maxSide=600,ratio=Math.min(1,maxSide/cropW,maxSide/cropH),out=document.createElement('canvas');out.width=Math.max(1,Math.round(cropW*ratio));out.height=Math.max(1,Math.round(cropH*ratio));out.getContext('2d').drawImage(canvas,left,top,cropW,cropH,0,0,out.width,out.height);resolve(out.toDataURL('image/webp',.78))"""
          if old not in s:
              raise SystemExit('cropMediaImage target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix design save after replacing images"
          git push
