name: Fix Marks Calculator Final
on:
  push:
    paths:
      - '.github/workflows/fix-marks-calculator-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply calculator width fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='mc-force-full-width-20260926'
          css='''<style id="mc-force-full-width-20260926">
#marksCalculator:not(.hidden){display:block!important;position:fixed!important;inset:0!important;z-index:9999!important;width:100vw!important;height:100vh!important;overflow:auto!important;background:#f3f6fb!important}
#marksCalculator .dash-content{width:100%!important;max-width:none!important;min-width:1050px!important;margin:0!important;padding:24px 32px!important}
#marksCalculator .dash-content>div{width:calc(100vw - 64px)!important;max-width:1400px!important;min-width:1000px!important;margin:18px auto!important}
#marksCalculator #mcSummary{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;width:100%!important}
#marksCalculator #mcTable{width:100%!important;min-width:1000px!important;table-layout:auto!important}
#marksCalculator #mcTable th,#marksCalculator #mcTable td{padding:9px 8px!important;white-space:nowrap!important;text-align:center!important}
#marksCalculator #mcTable th:first-child,#marksCalculator #mcTable td:first-child{text-align:left!important;min-width:230px!important}
</style>'''
          if marker not in s:
              s=s.replace('</head>',css+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Force Marks Calculator full width"
          git push