name: Add Marks Calculator sidebar item

on:
  push:
    paths:
      - '.github/workflows/add-marks-calculator.yml'

permissions:
  contents: write

jobs:
  update-sidebar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Marks Calculator name only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '>Marks Calculator<' not in s:
              needle = '''      </details>\n    </nav>'''
              replacement = '''      </details>\n      <button class="side-link" type="button"><span class="side-icon">∑</span><span>Marks Calculator</span></button>\n    </nav>'''
              if needle not in s:
                  raise SystemExit('Sidebar insertion point not found')
              s = s.replace(needle, replacement, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit sidebar name
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Marks Calculator to dashboard sidebar"
          git push
